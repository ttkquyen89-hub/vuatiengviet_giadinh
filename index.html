    <title>Vua Tiếng Việt - Trò Chơi Ghép Chữ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->

    <style>
        /* Custom Styles & Animations */
        body {
            font-family: 'Inter', sans-serif;
            background-image: url("HÌNH.jpg") !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            background-color: #ffd1dc !important; /* Màu nền hồng pastel dự phòng */
            color: #1f2937; /* Dark gray text */
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        h1, h2, h3, .font-game {
            font-family: 'Baloo 2', cursive;
        }

        .title-3d {
            color: #ea580c; /* Dark Orange */
            text-shadow: 
                1px 1px 0 #c2410c, 
                2px 2px 0 #c2410c, 
                3px 3px 0 #9a3412, 
                4px 4px 0 #9a3412, 
                5px 5px 0 #7c2d12, 
                6px 6px 12px rgba(0,0,0,0.3);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            border-radius: 1.5rem;
        }

        /* Tile Styles */
        .letter-tile {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #78350f; /* Dark brown text */
            background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
            border-radius: 0.5rem;
            box-shadow: 0 4px 0 #a16207, 0 5px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            font-family: 'Baloo 2', cursive;
            text-transform: uppercase;
        }
        
        @media (min-width: 640px) {
            .letter-tile {
                width: 3.5rem;
                height: 3.5rem;
                font-size: 1.75rem;
            }
        }

        .letter-tile:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #a16207, 0 2px 5px rgba(0,0,0,0.2);
        }

        .letter-tile.disabled {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }

        /* Slot Styles */
        .letter-slot {
            width: 3rem;
            height: 3rem;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }
        
        @media (min-width: 640px) {
            .letter-slot {
                width: 3.5rem;
                height: 3.5rem;
            }
        }

        .letter-slot.filled {
            border-style: solid;
            border-color: transparent;
            background: transparent;
        }

        /* Space between words indicator */
        .word-space {
            width: 1rem;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
            border-color: #ef4444 !important; /* Red flash */
        }
        
        @keyframes successPulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .animate-success {
            animation: successPulse 1s;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }
    </style>

<body class="antialiased flex flex-col items-center">

    <!-- Configuration block to detect environment -->
    <script>
        // If this app is exported, APP_MODE will be injected as 'student'
        window.APP_MODE = window.APP_MODE || 'creator';
        window.INJECTED_WORDS = window.INJECTED_WORDS || [];
    </script>

    <!-- UI: CREATOR / TEACHER (Hidden in exported mode) -->
    

    <!-- UI: GAME (Hidden initially in creator mode) -->
    <div id="game-ui" class="hidden w-full max-w-3xl p-2 sm:p-4 flex-grow flex flex-col items-center justify-center min-h-screen">
        
        <!-- Game Header -->
        <div class="w-full flex justify-between items-center mb-6 px-4 glass-panel rounded-full py-3">
            <div class="flex items-center space-x-2">
                <div class="bg-yellow-400 text-yellow-900 rounded-full w-10 h-10 flex items-center justify-center font-bold text-xl shadow-inner font-game" id="level-display">
                    1
                </div>
                <span class="font-semibold text-gray-700 hidden sm:inline">/ <span id="total-levels">10</span></span>
            </div>
            
            <h1 class="text-2xl sm:text-3xl font-bold font-game title-3d absolute left-1/2 transform -translate-x-1/2">
                Vua Tiếng Việt
            </h1>

            <div class="flex items-center space-x-3 text-lg font-bold">
                <div class="flex items-center text-green-600">
                    <i class="fa-solid fa-star mr-1"></i> <span id="score-display">0</span>
                </div>
                <div class="flex items-center text-red-500 ml-4">
                    <i class="fa-regular fa-clock mr-1"></i> <span id="timer-display">30</span>s
                </div>
            </div>
        </div>

        <!-- Answer Slots Area -->
        <div class="w-full flex flex-wrap justify-center items-center mb-10 gap-y-4 px-2 mt-8" id="slots-container">
            <!-- Slots will be generated here -->
        </div>

        <!-- Available Letters Area -->
        <div class="w-full flex flex-wrap justify-center items-center gap-2 sm:gap-3 mb-10 glass-panel p-6 rounded-3xl" id="letters-container">
            <!-- Letter tiles will be generated here -->
        </div>

        <!-- Controls -->
        <div class="flex gap-4">
            <button onclick="skipQuestion()" class="bg-gray-800 bg-opacity-10 hover:bg-opacity-20 text-gray-800 font-bold py-2 px-6 rounded-full transition-all border border-gray-400">
                <i class="fa-solid fa-forward mr-2"></i> Bỏ qua
            </button>
            <button id="btn-exit-test" onclick="exitTestMode()" class="hidden bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-full transition-all shadow-lg">
                <i class="fa-solid fa-xmark mr-2"></i> Thoát
            </button>
        </div>
    </div>

    <!-- UI: STUDENT WELCOME (Hidden initially, shown only in exported student mode) -->
    <div id="student-welcome-view" class="hidden w-full flex-grow flex-col items-center justify-center min-h-screen">
        <h1 class="text-6xl sm:text-8xl md:text-9xl font-bold font-game title-3d mb-10 leading-tight text-center px-4 tracking-wide">
            VUA TIẾNG VIỆT
        </h1>
        <button id="btn-play-game" class="bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white font-bold py-4 px-10 sm:py-5 sm:px-14 rounded-full shadow-2xl transition-transform transform hover:scale-110 flex items-center justify-center text-2xl sm:text-4xl font-game border-4 border-white">
            <i class="fa-solid fa-play mr-4"></i> PLAY GAME
        </button>
    </div>

    <!-- Custom Modal Message Box -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white text-gray-900 rounded-3xl p-6 sm:p-8 w-full max-w-sm text-center shadow-2xl transform transition-transform scale-95" id="modal-content">
            <div id="modal-icon" class="text-5xl mb-4">👑</div>
            <h2 id="modal-title" class="text-2xl font-game font-bold mb-3 text-blue-900">Tiêu đề</h2>
            <p id="modal-desc" class="mb-8 text-gray-600 text-lg">Nội dung thông báo</p>
            <button id="modal-btn" class="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 w-full text-lg">
                Đồng ý
            </button>
        </div>
    </div>

    <!-- Core Logic -->
    <script>
        // ---- Global State ----
        let gameData = [];
        let currentLevel = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval = null;
        
        // Structure for current word mechanics
        let targetWordStr = "";
        let structure = []; // Array representing slots (chars and spaces)
        let availableTiles = []; // Shuffled letters
        let placedTiles = []; // Array mapping slot index to tile object
        
        let synthCorrect = null;
        let synthWrong = null;

        const TIME_PER_QUESTION = 30; // Seconds

        // ---- DOM Elements ----
        const uiCreator = document.getElementById('creator-ui');
        const viewWelcome = document.getElementById('welcome-view');
        const viewSettings = document.getElementById('settings-view');
        const uiGame = document.getElementById('game-ui');
        const wordInput = document.getElementById('word-input');
        
        const slotsContainer = document.getElementById('slots-container');
        const lettersContainer = document.getElementById('letters-container');
        const levelDisplay = document.getElementById('level-display');
        const totalLevelsDisplay = document.getElementById('total-levels');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const btnExitTest = document.getElementById('btn-exit-test');
        
        const studentWelcomeView = document.getElementById('student-welcome-view');
        const btnPlayGame = document.getElementById('btn-play-game');

        const modal = document.getElementById('custom-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalIcon = document.getElementById('modal-icon');
        const modalBtn = document.getElementById('modal-btn');
        let modalCallback = null;

        // ---- Audio Initialization ----
        function initAudio() {
            if (!synthCorrect) {
                synthCorrect = new Tone.PolySynth(Tone.Synth).toDestination();
                synthCorrect.volume.value = -10;
            }
            if (!synthWrong) {
                synthWrong = new Tone.Synth({
                    oscillator: { type: 'square' },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
                }).toDestination();
                synthWrong.volume.value = -10;
            }
        }

        function playSound(type) {
            if (!synthCorrect || !synthWrong || Tone.context.state !== 'running') return;
            const now = Tone.now();
            if (type === 'correct') {
                synthCorrect.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", now);
            } else if (type === 'wrong') {
                synthWrong.triggerAttackRelease("C2", "8n", now);
            }
        }

        // ---- Initialization ----
        document.addEventListener('DOMContentLoaded', () => {
            if (window.APP_MODE === 'student') {
                // We are in the exported file!
                if(uiCreator) uiCreator.remove(); // Remove creator UI completely for cleaner DOM
                
                // Show Student Welcome View instead of immediate modal
                studentWelcomeView.classList.remove('hidden');
                studentWelcomeView.classList.add('flex');

                // Handle Play Game button click
                btnPlayGame.addEventListener('click', async () => {
                    await Tone.start();
                    initAudio();
                    
                    // Hide welcome screen and show game
                    studentWelcomeView.classList.add('hidden');
                    studentWelcomeView.classList.remove('flex');
                    uiGame.classList.remove('hidden');
                    
                    if (window.INJECTED_WORDS && window.INJECTED_WORDS.length > 0) {
                        startGame(window.INJECTED_WORDS);
                    } else {
                        showModal('Lỗi', 'Không tìm thấy dữ liệu trò chơi!', '❌');
                    }
                });
            } else {
                // We are in Creator mode
                // Put some default sample data if empty
                if(wordInput.value.trim() === '') {
                    wordInput.value = "CHÂN THÀNH\nTHẤU HIỂU\nĐỒNG CẢM\nGẮN BÓ\nSẺ CHIA";
                }
            }
        });

        // ---- Utility: Custom Modal ----
        function showModal(title, desc, icon, buttonText = 'Tiếp tục', callback = null) {
            modalTitle.textContent = title;
            modalDesc.innerHTML = desc;
            modalIcon.textContent = icon;
            modalBtn.textContent = buttonText;
            modalCallback = callback;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        modalBtn.addEventListener('click', () => {
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (modalCallback) modalCallback();
            }, 200);
        });

        // ---- Creator Functions ----
        function showSettings() {
            viewWelcome.classList.add('hidden');
            viewSettings.classList.remove('hidden');
            viewSettings.classList.add('flex');
        }

        function hideSettings() {
            viewSettings.classList.add('hidden');
            viewSettings.classList.remove('flex');
            viewWelcome.classList.remove('hidden');
        }

        function parseInputData() {
            const raw = wordInput.value.trim();
            if (!raw) return [];
            
            const lines = raw.split('\n');
            const data = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const word = line.toUpperCase();
                const cleanWord = word.replace(/\s+/g, ' '); 
                if (cleanWord) {
                    data.push({ word: cleanWord });
                }
            }
            return data;
        }

        async function startTestMode() {
            const parsedData = parseInputData();
            if (parsedData.length === 0) {
                showModal('Lỗi Nhập Liệu', 'Vui lòng nhập ít nhất 1 từ vựng.', '⚠️', 'Đã hiểu');
                return;
            }
            
            await Tone.start();
            initAudio();

            uiCreator.classList.add('hidden');
            uiGame.classList.remove('hidden');
            btnExitTest.classList.remove('hidden'); // Show exit button in test mode
            
            startGame(parsedData);
        }

        function exitTestMode() {
            stopTimer();
            uiGame.classList.add('hidden');
            uiCreator.classList.remove('hidden');
            showSettings(); // Ensure settings view is visible when returning
        }

        function exportHTML() {
            const parsedData = parseInputData();
            if (parsedData.length === 0) {
                showModal('Lỗi Nhập Liệu', 'Vui lòng nhập dữ liệu trước khi xuất Game.', '⚠️', 'Đã hiểu');
                return;
            }

            // Clone the current document
            const htmlClone = document.documentElement.cloneNode(true);
            
            // Remove creator UI from clone to prevent students from seeing/editing it
            const clonedCreatorUI = htmlClone.querySelector('#creator-ui');
            if (clonedCreatorUI) clonedCreatorUI.remove();

            // Inject the configuration script into the <head> of the clone
            const configScript = document.createElement('script');
            configScript.textContent = `
                // Injected Game Data
                window.APP_MODE = 'student';
                window.INJECTED_WORDS = ${JSON.stringify(parsedData)};
            `;
            htmlClone.querySelector('head').prepend(configScript);

            // Assemble final HTML string
            const finalHTML = "<!DOCTYPE html>\n" + htmlClone.outerHTML;

            // Trigger Download
            const blob = new Blob([finalHTML], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'VuaTiengViet_Game.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showModal('Thành công!', 'File Game HTML đã được tải xuống máy của bạn. Bạn có thể gửi file này cho học sinh để chơi ngay mà không cần cài đặt.', '🎉', 'Tuyệt vời');
        }

        // ---- Game Core Logic ----
        function startGame(data) {
            gameData = shuffleArray([...data]); // Shuffle the questions
            currentLevel = 0;
            score = 0;
            totalLevelsDisplay.textContent = gameData.length;
            updateScore();
            
            loadLevel();
        }

        function loadLevel() {
            if (currentLevel >= gameData.length) {
                endGame();
                return;
            }

            const currentData = gameData[currentLevel];
            targetWordStr = currentData.word;
            levelDisplay.textContent = currentLevel + 1;
            
            // Parse target word into structure
            structure = [];
            let slotIndexCounter = 0;
            const chars = targetWordStr.split('');
            
            let charactersToShuffle = [];

            chars.forEach(char => {
                if (char === ' ') {
                    structure.push({ isSpace: true });
                } else {
                    structure.push({ 
                        isSpace: false, 
                        char: char, 
                        slotIndex: slotIndexCounter 
                    });
                    charactersToShuffle.push(char);
                    slotIndexCounter++;
                }
            });

            // Prepare state tracking arrays
            placedTiles = new Array(slotIndexCounter).fill(null);
            
            // Shuffle characters and create tile objects
            charactersToShuffle = shuffleArray(charactersToShuffle);
            availableTiles = charactersToShuffle.map((char, idx) => ({
                id: `tile-${idx}`,
                char: char,
                used: false
            }));

            renderBoard();
            startTimer();
        }

        function renderBoard() {
            // Render Slots
            slotsContainer.innerHTML = '';
            
            // Flex container wrapper to keep words grouped nicely
            let currentWordDiv = document.createElement('div');
            currentWordDiv.className = 'flex gap-1 sm:gap-2';
            
            structure.forEach((item) => {
                if (item.isSpace) {
                    slotsContainer.appendChild(currentWordDiv);
                    
                    const spaceIndicator = document.createElement('div');
                    spaceIndicator.className = 'word-space';
                    slotsContainer.appendChild(spaceIndicator);
                    
                    currentWordDiv = document.createElement('div');
                    currentWordDiv.className = 'flex gap-1 sm:gap-2';
                } else {
                    const slot = document.createElement('div');
                    const placedTileObj = placedTiles[item.slotIndex];
                    
                    slot.className = `letter-slot relative cursor-pointer ${placedTileObj ? 'filled' : ''}`;
                    slot.dataset.index = item.slotIndex;
                    
                    if (placedTileObj) {
                        // Render a tile inside the slot
                        const tileInner = document.createElement('div');
                        tileInner.className = 'letter-tile absolute animate-pop w-full h-full';
                        tileInner.textContent = placedTileObj.char;
                        slot.appendChild(tileInner);
                        
                        // Click to return tile to pool
                        slot.onclick = () => returnTile(item.slotIndex);
                    } else {
                        // Empty slot
                        slot.onclick = null;
                    }
                    
                    currentWordDiv.appendChild(slot);
                }
            });
            slotsContainer.appendChild(currentWordDiv);

            // Render Available Tiles
            lettersContainer.innerHTML = '';
            availableTiles.forEach(tile => {
                const btn = document.createElement('div');
                btn.className = `letter-tile ${tile.used ? 'disabled' : ''}`;
                btn.id = tile.id;
                btn.textContent = tile.char;
                
                if (!tile.used) {
                    btn.onclick = () => placeTile(tile.id);
                }
                
                lettersContainer.appendChild(btn);
            });
        }

        // ---- Interaction Logic ----
        function placeTile(tileId) {
            // Find first empty slot
            const emptyIndex = placedTiles.findIndex(t => t === null);
            if (emptyIndex === -1) return; // No empty slots

            // Find tile
            const tileIndex = availableTiles.findIndex(t => t.id === tileId);
            if (tileIndex === -1 || availableTiles[tileIndex].used) return;

            // Update state
            availableTiles[tileIndex].used = true;
            placedTiles[emptyIndex] = availableTiles[tileIndex];

            renderBoard();
            
            // Check win condition right after rendering, but give UI time to update
            setTimeout(() => {
                checkAnswer();
            }, 50);
        }

        function returnTile(slotIndex) {
            const tileObj = placedTiles[slotIndex];
            if (!tileObj) return;

            // Mark tile as unused
            const tileIndex = availableTiles.findIndex(t => t.id === tileObj.id);
            if (tileIndex !== -1) {
                availableTiles[tileIndex].used = false;
            }

            // Clear slot
            placedTiles[slotIndex] = null;
            
            // Optional: Auto-shift remaining tiles left? No, let player manage gaps, or yes?
            // Usually in these games, removing a letter just frees the slot.
            // Let's implement gravity (shift left) for better UX.
            shiftTilesLeft();
            
            renderBoard();
        }

        function shiftTilesLeft() {
            // Filter out nulls
            const currentPlaced = placedTiles.filter(t => t !== null);
            // Rebuild placedTiles array with nulls at the end
            placedTiles = new Array(placedTiles.length).fill(null);
            currentPlaced.forEach((t, i) => placedTiles[i] = t);
        }

        function checkAnswer() {
            // Check if all slots are filled
            if (placedTiles.includes(null)) return;

            // Construct string
            let currentAnswerStr = "";
            let placedIdx = 0;
            
            structure.forEach(item => {
                if (item.isSpace) {
                    currentAnswerStr += " ";
                } else {
                    currentAnswerStr += placedTiles[placedIdx].char;
                    placedIdx++;
                }
            });

            if (currentAnswerStr === targetWordStr) {
                // Correct!
                stopTimer();
                playSound('correct');
                score += 10 + Math.floor(timeLeft / 2); // Bonus points for time
                updateScore();
                
                // Visual effect
                slotsContainer.classList.add('animate-success');
                
                setTimeout(() => {
                    slotsContainer.classList.remove('animate-success');
                    showModal('Chính xác!', `Từ đúng là: <br><strong class="text-2xl text-green-600 mt-2 block">${targetWordStr}</strong><br>Bạn được cộng điểm!`, '🌟', 'Tiếp tục', () => {
                        currentLevel++;
                        loadLevel();
                    });
                }, 800);

            } else {
                // Wrong!
                playSound('wrong');
                slotsContainer.classList.add('animate-shake');
                setTimeout(() => {
                    slotsContainer.classList.remove('animate-shake');
                }, 500);
            }
        }

        function skipQuestion() {
            stopTimer();
            showModal('Bỏ qua', `Từ đúng là: <br><strong class="text-2xl text-blue-600 mt-2 block">${targetWordStr}</strong>`, 'ℹ️', 'Câu tiếp theo', () => {
                currentLevel++;
                loadLevel();
            });
        }

        function endGame() {
            stopTimer();
            let msg = `Bạn đã hoàn thành tất cả các câu hỏi!<br>Tổng điểm của bạn là: <strong class="text-3xl text-yellow-500 block mt-2">${score}</strong>`;
            
            showModal('Kết thúc Game!', msg, '🏆', 'Chơi lại', () => {
                // Reset game if they click Chơi lại
                startGame(gameData);
            });
        }

        // ---- Timer & Utilities ----
        function startTimer() {
            stopTimer();
            timeLeft = TIME_PER_QUESTION;
            timerDisplay.textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                
                if (timeLeft <= 5) {
                    timerDisplay.parentElement.classList.add('text-red-500', 'animate-pulse');
                } else {
                    timerDisplay.parentElement.classList.remove('text-red-500', 'animate-pulse');
                }

                if (timeLeft <= 0) {
                    stopTimer();
                    handleTimeOut();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerDisplay.parentElement.classList.remove('text-red-500', 'animate-pulse');
        }

        function handleTimeOut() {
            showModal('Hết giờ!', `Từ đúng là: <br><strong class="text-2xl text-red-600 mt-2 block">${targetWordStr}</strong>`, '⏰', 'Câu tiếp theo', () => {
                currentLevel++;
                loadLevel();
            });
        }

        function updateScore() {
            scoreDisplay.textContent = score;
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

    </script>

</body></html>
